name: CI

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      - name: Verify Node sqlite support
        run: node -e "import('node:sqlite').then(() => console.log('node:sqlite ok')).catch((error) => { console.error(error); process.exit(1) })"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint:all

      - name: Run type check
        run: bun run typecheck:all

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Build client-only connector
        working-directory: apps/connector
        run: bun run build

      - name: Build Gateway desktop
        run: bun run build:gateway

      - name: Build Gateway container
        run: docker build --file apps/gateway/Dockerfile --tag copilot-api-ci .
