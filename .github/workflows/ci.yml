name: ModelBridge CI

on:
  push:
    branches: [main, master, refactor/modelbridge]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run lint:all
      - run: bun run typecheck:all
      - run: bun run test
      - run: bun run build
      - name: Verify isolated native profile persistence
        shell: pwsh
        run: |
          $env:MODELBRIDGE_TEST_ELECTRON = node -p "require('electron')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Location apps\modelbridge
          bun test ./tests/native-profile.test.ts
          exit $LASTEXITCODE
